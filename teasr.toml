duration = 1000

[[scenes.interactions]]
type = "snapshot"

# Every state of the console's own primitives, drawn without the server.
[[scenes]]
type = "web"
name = "primitives"
uri = "http://127.0.0.1:5173/gallery.html"
viewport = { width = 1280, height = 900 }
full_page = true

[[scenes.interactions]]
type = "wait"
duration = 1500

[[scenes.interactions]]
type = "snapshot"
