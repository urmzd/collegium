# Screenshots of the web console, written to ./showcase.
# Needs `make dev` and `make web` running, then `teasr run`.
# The console opens directly, including on a fresh server.

[output]
dir = "./showcase"

[[output.formats]]
output_type = "png"

[[scenes]]
type = "web"
name = "home"
uri = "http://127.0.0.1:5173/"
viewport = { width = 1440, height = 900 }

[[scenes.interactions]]
type = "wait"
duration = 1500

[[scenes.interactions]]
type = "snapshot"

[[scenes]]
type = "web"
name = "runs"
uri = "http://127.0.0.1:5173/"
viewport = { width = 1440, height = 900 }

[[scenes.interactions]]
type = "wait"
duration = 1200

[[scenes.interactions]]
type = "click"
selector = 'nav[aria-label="Sections"] button[aria-label="Runs"]'
hidden = true

[[scenes.interactions]]
type = "wait"
duration = 800

[[scenes.interactions]]
type = "snapshot"

[[scenes]]
type = "web"
name = "agents"
uri = "http://127.0.0.1:5173/"
viewport = { width = 1440, height = 900 }

[[scenes.interactions]]
type = "wait"
duration = 1200

[[scenes.interactions]]
type = "click"
selector = 'nav[aria-label="Sections"] button[aria-label="Agents"]'
hidden = true

[[scenes.interactions]]
type = "wait"
duration = 800

[[scenes.interactions]]
type = "snapshot"

[[scenes]]
type = "web"
name = "analytics"
uri = "http://127.0.0.1:5173/"
viewport = { width = 1440, height = 900 }

[[scenes.interactions]]
type = "wait"
